    <script>
        function initKeymanInput() {
            if (window.keyman && document.getElementById('inputText')) {
            let ele = document.getElementById('inputText');
            window.keyman.attachToControl(ele);
            window.keyman.enableControl(ele);
            ele.addEventListener('input', function(e) {
                document.getElementById('displayText').textContent = e.target.value;
            });
            } else {
            // Try again shortly if keyman or input isn't ready yet
            setTimeout(initKeymanInput, 100);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
                keyman.init({attachType:'manual'}).then(() => {
                console.log("Attached....")
                keyman.addKeyboards('@en'); // Loads default English keyboard from Keyman Cloud (CDN)
                keyman.addKeyboards('sil_greek_polytonic@el'); // Loads default Greek keyboard from Keyman Cloud (CDN)

                initKeymanInput();
            });
        });
        
    </script>
