  <script>
    let morphResponseData = {};
    let originalWord = '';
    function parsePerseusResponse(response) {
        const body = response?.RDF?.Annotation?.Body;
        if (!body) return [];
    
        const bodyList = Array.isArray(body) ? body : [body];
        const rawOutput = bodyList.flatMap(bodyItem => {
        const entry = bodyItem.rest?.entry;
        const dict = entry?.dict || {};
        const infls = Array.isArray(entry?.infl) ? entry.infl : [entry?.infl].filter(Boolean);
    
        const base = {
            lemma: dict.hdwd?.["$"] || null,
            partOfSpeech: dict.pofs?.["$"] || null
        };
    
        return infls.map(infl => ({
            ...base,
            case: infl?.case?.["$"] || null,
            gender: infl?.gend?.["$"] || null,
            number: infl?.num?.["$"] || null,
            tense: infl?.tense?.["$"] || null,
            voice: infl?.voice?.["$"] || null,
            mood: infl?.mood?.["$"] || null,
            person: infl?.pers?.["$"] || null,
            stem: infl?.term?.stem?.["$"] || null,
            suffix: infl?.term?.suff?.["$"] || null,
            morph: infl?.morph?.["$"] || null,
            stemtype: infl?.stemtype?.["$"] || null,
            derivtype: infl?.derivtype?.["$"] || null,
            dialect: infl?.dial?.["$"] || null
        }));
        });

        // remove null fields
        return rawOutput.map((o) => {
            let d = {}
            for(const k of Object.keys(o)) {
                if(o[k]) {
                    d[k] = o[k]
                }
            }

            return d;
        })
    }

    function displayGrammarInfo(dataArray) {
      const grammarInfo = document.getElementById('grammarInfo');
      grammarInfo.style.display = 'flex';
      
      // Clear previous content
      grammarInfo.innerHTML = '';
      
      // Helper function to create a grammar item
      const createGrammarItem = (label, value) => {
        if (!value) return null;
        const item = document.createElement('div');
        item.className = 'grammar-item';
        item.innerHTML = `
          <span class="grammar-label">${label}:</span>
          <span class="grammar-value">${value}</span>
        `;
        return item;
      };

      // Process each form in the data array
      dataArray.forEach((data, index) => {
        // Create container for this form
        const formContainer = document.createElement('div');
        formContainer.className = 'grammar-form';
        
        // Add form number
        const formNumber = document.createElement('div');
        formNumber.className = 'form-number';
        formNumber.textContent = `Form ${index + 1}`;
        formContainer.appendChild(formNumber);
        
        // Add each grammatical feature
        const features = [
          { label: 'Lemma', value: data.lemma },
          { label: 'Part of Speech', value: data.partOfSpeech },
          { label: 'Case', value: data.case },
          { label: 'Gender', value: data.gender },
          { label: 'Number', value: data.number },
          { label: 'Tense', value: data.tense },
          { label: 'Voice', value: data.voice },
          { label: 'Mood', value: data.mood },
          { label: 'Person', value: data.person },
          { label: 'Stem', value: data.stem },
          { label: 'Suffix', value: data.suffix },
          { label: 'Morphology', value: data.morph },
          { label: 'Stem Type', value: data.stemtype },
          { label: 'Derivation Type', value: data.derivtype },
          { label: 'Dialect', value: data.dialect }
        ];

        // Add only non-null features
        features.forEach(feature => {
          const item = createGrammarItem(feature.label, feature.value);
          if (item) formContainer.appendChild(item);
        });

        grammarInfo.appendChild(formContainer);
      });
    }

    function parseLSJEntry(xmlString) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlString, "text/xml");

      const entries = [];

      const divs = doc.querySelectorAll("div2");

      divs.forEach(div => {
        const entry = {
          id: div.getAttribute("id"),
          key: div.getAttribute("key"),
          headword: null,
          forms: [],
          etymology: null,
          senses: []
        };

        // Headword
        const head = div.querySelector("head");
        if (head) {
          entry.headword = head.textContent.trim();
        }

        // Forms (e.g., adjective endings)
        const itypes = div.querySelectorAll("itype");
        entry.forms = Array.from(itypes).map(i => i.textContent.trim());

        // Etymology
        const etym = div.querySelector("etym");
        if (etym) {
          entry.etymology = etym.textContent.trim();
        }

        // Senses
        const senses = div.querySelectorAll("sense");
        entry.senses = Array.from(senses).map(sense => {
          const senseObj = {
            id: sense.getAttribute("id"),
            level: sense.getAttribute("level"),
            gloss: sense.querySelector("i")?.textContent.trim() || null,
            quotes: []
          };

          const quotes = sense.querySelectorAll("cit");
          senseObj.quotes = Array.from(quotes).map(cit => {
            const quote = cit.querySelector("quote")?.textContent.trim();
            const bibl = cit.querySelector("bibl");
            let biblRef = null;
            if (bibl) {
              biblRef = {
                author: bibl.querySelector("author")?.textContent.trim() || null,
                title: bibl.querySelector("title")?.textContent.trim() || null,
                passage: bibl.textContent.trim()
              };
            }
            return { quote, bibl: biblRef };
          });

          return senseObj;
        });

        entries.push(entry);
      });

      return entries;
    }
    
    function renderLexiconEntry(jsonEntry, i, totalSenses) {
      const data = jsonEntry;
      // const container = document.getElementById('entry');
      const container = document.createElement('div');

      // if(!data.gloss) {
      //   return;
      // }

      const processGloss = (sense) => {
        let processedText = '';
        let prevE = {}
        for(const e of sense.glosses) {
          processedText += `${prevE.after === e.before || !e.before ? '' : e.before} <span class="gloss-tag">${e.tag}</span> ${e.after ? ' ' + e.after + ' ' : ''}`
          prevE = e
        }

        return processedText;
      }

      container.className = 'lexicon-entry';

      const quotesHTML = data.quotes.map(q => {
        const b = q.bibl;
        if(!b) {
          return '';
        }
        const biblText = [b.author, b.title, b.passage].filter(Boolean).join(' ');
        return `
          <li>
            <span class="quote">${q.quote}</span>
            <span class="bibl">– ${biblText}</span>
          </li>`;
      }).join('');

      // <div class="gloss"> ${processGloss(data)}</div>
      container.innerHTML = `
        <div style="font-size: 12px; color: #808080; float: left;">📘 ${i+1} of ${totalSenses}</div>
        <br />
        <div class="gloss"> ${data.htmlText}</div>
        <div class="quotes">
          <h4>📜 Quotes:</h4>
          <ul>${quotesHTML}</ul>
        </div>
      `;

      return container;
    }

    function renderDodsonEntry(data) {
      // const data = {
      //   "Strong's": "2564",
      //   "Goodrick-Kohlenberger": "2813",
      //   "English Definition (brief)": "I call, invite, name",
      //   "English Definition (longer)": "(a) I call, summon, invite, (b) I call, name.",
      //   "greekWord": "καλέω",
      //   "Beta Code": "kale/w"
      // };

      if(!data) {
        return;
      }

      const container = document.getElementById('dodsonEntryContainer');

      for (const [key, value] of Object.entries(data)) {
        const row = document.createElement('div');
        row.className = 'dodson-entry-row';

        const keyDiv = document.createElement('div');
        keyDiv.className = 'dodson-key';
        keyDiv.textContent = key;

        const valueDiv = document.createElement('div');
        valueDiv.className = 'dodson-value';
        valueDiv.textContent = value;

        row.appendChild(keyDiv);
        row.appendChild(valueDiv);
        container.appendChild(row);
      }
    }

    async function getLexicalData() {
        const word = document.getElementById('greekInput').value;
        // const word = req.query.word;
        if (!word) {
            throw new Error('Word cannot be empty')
        }

        originalWord = word;
    
        try {
            const responseData = {
                morphData: {},
                meanings:[]
            }
            morphResponseData= responseData

            // <<<< LEXICON SECTION >>>>
            // const lexiconUrl = `https://rumbling-quintessential-banjo.glitch.me/api/lexica/${encodeURIComponent(parseResp[0].lemma)}`;
            const lexiconUrl = `https://rumbling-quintessential-banjo.glitch.me/api/lexica/${encodeURIComponent(word)}`;

            const lexiconRes = await fetch(lexiconUrl);
            if (!lexiconRes.ok) throw new Error("Failed to fetch lexicon");

            let lexiconResponse = await lexiconRes.json();

            console.log(lexiconResponse)
            morphResponseData.morphData = lexiconResponse.morphology
            const lsjJsonWordSenses = lexiconResponse.senses3

            const lexiconEntryDisplay = document.getElementById('lexiconEntryDisplay');
            lexiconEntryDisplay.innerHTML = '';
            const totalSenses = lsjJsonWordSenses.length;
            lsjJsonWordSenses.forEach((sense, i) => {
              lexiconEntryDisplay.appendChild(renderLexiconEntry(sense, i, totalSenses));
            })
            renderDodsonEntry(lexiconResponse.dodson)
            // <<< END LEXICON SECTION >>>


            // Show modal with link
            const modal = document.getElementById("myModal1");
            const modalLink = document.getElementById("modalLink1");
            // modalLink.href = `http://www.perseus.tufts.edu/hopper/morph?l=${encodeURIComponent(word)}&la=greek`;
            modal.style.display = "block";

            // Close modal when clicking the X
            const closeBtn = document.getElementsByClassName("close1")[0];
            closeBtn.onclick = function() {
                modal.style.display = "none";
            }

            // Close modal when clicking outside
            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = "none";
                }
            }

            // Display all morphological forms
            if (morphResponseData.morphData.length > 0) {
                displayGrammarInfo(morphResponseData.morphData);
            }

            return responseData;
        } catch (error) {
            console.log(error)
        }
    }

  async function addNewMorph() {
    // const meanings = document.getElementById('meaningsInput').value;
    const meanings = document.getElementById('copyTextarea').value;
    const vocabKeyInput = document.getElementById('vocabKeyInput').value;
    
    if (!meanings) {
        throw new Error('Meanings should not be empty')
    }

    if (!vocabKeyInput) {
        throw new Error('Dictionary key should not be empty')
    }

    // Cache the new data
    // https://rumbling-quintessential-banjo.glitch.me/api/vocab/list/eusebius
    const resRaw = await fetch('https://rumbling-quintessential-banjo.glitch.me/api/vocab/add', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            vocabKey: vocabKeyInput,
            word: originalWord,
            ...morphResponseData,
            meanings: meanings.split(',')
        })
    });

    if (!resRaw.ok) throw new Error("Failed save to Dictionary");

    const contentType = resRaw.headers.get("Content-Type");

    let response = {};

    // if (contentType === 'application/json') {
    //     response = await resRaw.json();
    // }
    response = await resRaw.json();

    if(response.message && !response.successful) {
        alert(response.message)
    } else {
        alert('Successfully saved word')
    }

    console.log(response)
  }
